services:
  gatus:
    container_name: gatus
    image: twinproduction/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
    restart: unless-stopped
    networks:
      - gatus_network
    volumes:
      - gatus_data:/data
      - ./config.yaml:/config/config.yaml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.status.rule=Host(`status.ocd.beauty`)
      - traefik.http.routers.status.entrypoints=websecure
      - traefik.http.routers.status.tls=true
      - traefik.http.services.status.loadbalancer.server.port=8080
networks:
  gatus_network:
    external: true
volumes:
  gatus_data:
