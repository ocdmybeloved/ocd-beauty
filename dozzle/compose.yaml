services:
  dozzle-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
      - EXEC=0
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - SYSTEM=0
      - PLUGINS=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - SECRETS=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  dozzle:
    image: amir20/dozzle:v10.7.3-alpine@sha256:f1ed2bbbcae850cf0d3fb8956535fdea766933dc24a24dfedc2c752b8b8a239f
    restart: unless-stopped
    volumes:
      - dozzle_data:/data
      - /srv/dozzle/data/users.yaml:/data/users.yaml:ro
    ports:
      - 50495:8080
    environment:
      - DOCKER_HOST=tcp://dozzle-socket-proxy:2375
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_NO_ANALYTICS=true
volumes:
  dozzle_data:
