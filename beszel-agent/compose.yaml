services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.18.8@sha256:3b1939746690e423072b4a99bf4c4af6dd9562a68978a33738a3c4a4cc000c39
    restart: unless-stopped
    networks:
      - beszel_network
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
    environment:
      - DOCKER_HOST=tcp://beszel-agent-socket-proxy:2375
      - HUB_URL=http://beszel:8090
      - KEY=${KEY}
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${TOKEN}
    security_opt:
      - no-new-privileges:true
networks:
  beszel_network:
    external: true
volumes:
  beszel_agent_data:
  beszel_socket:
    external: true
    name: beszel_socket
