services:
  caddy:
    container_name: caddy
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    networks:
      - gatus_network
      - gitea_network
      - navidrome_network
      - woodpecker_ci_network
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /etc/caddy/certs/ocd.beauty.pem:/etc/caddy/certs/ocd.beauty.pem:ro
      - /etc/caddy/certs/ocd.beauty.key:/etc/caddy/certs/ocd.beauty.key:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
networks:
  gatus_network:
    external: true
  gitea_network:
    external: true
  navidrome_network:
    external: true
  woodpecker_ci_network:
    external: true
volumes:
  caddy_data:
  caddy_config:
