services:
  caddy:
    container_name: caddy
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    networks:
      - gatus_network
      - gitea_network
      - navidrome_network
      - woodpecker_ci_network
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
networks:
  gatus_network:
    external: true
  gitea_network:
    external: true
  navidrome_network:
    external: true
  woodpecker_ci_network:
    external: true
volumes:
  caddy_data:
  caddy_config:
